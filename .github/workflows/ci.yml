name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

# A newer push to the same PR cancels the older run; main runs always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The bundle only changes when the pin does, so skip rebuilding the fork
      - name: Restore vendored microtonal
        uses: actions/cache@v6
        with:
          path: vendor/microtonal
          key: microtonal-${{ hashFiles('vendor/microtonal/SOURCE.json') }}

      - name: Build vendored microtonal (pinned in vendor/microtonal/SOURCE.json)
        run: pnpm vendor:microtonal --ensure
        env:
          # Authenticated GitHub API call for the pinned-branch check
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check dead code (jscpd)
        run: pnpm deadcode

      - name: Check code duplication (jscpd)
        run: pnpm dup

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (full suite)
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

  docker:
    # Only publish an image that passed the gates
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      # arm64 is emulated, so PRs only check that the amd64 image builds
      - name: Set up QEMU
        if: env.PUBLISH == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Only main writes the layer cache, so PR builds can't evict it
          cache-to: ${{ env.PUBLISH == 'true' && 'type=gha,mode=max' || '' }}
